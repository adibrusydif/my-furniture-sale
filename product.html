<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Product — Furniture Sale</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#FAF8F5;--surface:#fff;--primary:#B5622A;
      --text:#1C1917;--muted:#78716C;--border:#E7E5E4;
      --r:12px;--sh:0 1px 3px rgba(0,0,0,.1),0 1px 2px rgba(0,0,0,.06);
    }
    body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

    /* ── Nav ─────────────────────────────────────────────────────── */
    .nav{background:linear-gradient(135deg,#1C0A00,#5C3317,#8B4513);padding:0 20px;height:52px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50}
    .back{color:rgba(255,255,255,.8);text-decoration:none;font:500 .875rem/1 'Inter',sans-serif;display:flex;align-items:center;gap:5px;transition:color .15s;flex-shrink:0}
    .back:hover{color:#fff}
    .nav-name{color:rgba(255,255,255,.45);font-size:.82rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

    /* ── Page layout ─────────────────────────────────────────────── */
    .page{max-width:1080px;margin:0 auto;padding:36px 20px 64px;display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:start}
    @media(max-width:700px){.page{grid-template-columns:1fr;gap:20px;padding:20px 14px 56px}}

    /* ── Gallery ─────────────────────────────────────────────────── */
    .gallery{}
    .main-wrap{position:relative;background:#F0EAE0;border-radius:var(--r);overflow:hidden;aspect-ratio:4/3;box-shadow:var(--sh);margin-bottom:10px;cursor:zoom-in}
    #main-img{width:100%;height:100%;object-fit:contain;display:block}
    .zoom-hint{position:absolute;bottom:10px;right:12px;background:rgba(0,0,0,.55);color:#fff;font-size:.7rem;font-weight:500;padding:3px 10px;border-radius:99px;opacity:0;transition:opacity .2s;pointer-events:none}
    .main-wrap:hover .zoom-hint{opacity:1}
    .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:5rem;background:linear-gradient(135deg,#F0EAE0,#E0D5C5)}
    .garr{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.88);border:none;border-radius:50%;width:36px;height:36px;font-size:1.15rem;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.18);transition:all .15s;z-index:2}
    .garr:hover{background:#fff;transform:translateY(-50%) scale(1.1)}
    .garr.p{left:10px}.garr.n{right:10px}
    .thumbs{display:flex;gap:8px;flex-wrap:wrap}
    .thumb{width:72px;height:72px;border-radius:8px;overflow:hidden;cursor:pointer;border:2.5px solid transparent;transition:all .15s;flex-shrink:0}
    .thumb:hover{border-color:var(--primary)}
    .thumb.on{border-color:var(--primary);box-shadow:0 0 0 3px rgba(181,98,42,.2)}
    .thumb img{width:100%;height:100%;object-fit:cover;display:block}

    /* ── Info ────────────────────────────────────────────────────── */
    .tag{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--primary);margin-bottom:10px;display:block}
    .ptitle{font-size:clamp(1.4rem,3vw,2rem);font-weight:700;line-height:1.2;letter-spacing:-.02em;margin-bottom:18px}
    .prow{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
    .pprice{font-size:2rem;font-weight:700;color:var(--primary)}
    .badge{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:5px 14px;border-radius:99px}
    .badge.av{background:#DCFCE7;color:#15803D}
    .badge.sd{background:#FEE2E2;color:#B91C1C}
    .divider{height:1px;background:var(--border);margin-bottom:20px}
    .dlabel{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:10px}
    .desc{font-size:.95rem;line-height:1.8;color:var(--muted);white-space:pre-wrap}

    /* ── States ──────────────────────────────────────────────────── */
    .msg{text-align:center;padding:80px 20px}
    .msg .ico{font-size:3.5rem;display:block;margin-bottom:12px}
    .msg h3{font-size:1.2rem;font-weight:600;margin-bottom:6px}
    .msg p{color:var(--muted);font-size:.875rem}

    /* ── Skeleton ────────────────────────────────────────────────── */
    .sk-layout{max-width:1080px;margin:0 auto;padding:36px 20px;display:grid;grid-template-columns:1fr 1fr;gap:48px}
    @media(max-width:700px){.sk-layout{grid-template-columns:1fr;gap:24px;padding:20px 14px}}
    .sk{background:linear-gradient(90deg,#EDE7DF 25%,#DDD5C8 50%,#EDE7DF 75%);background-size:200% 100%;animation:sh 1.4s infinite;border-radius:6px}
    @keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
    .sk-img{height:320px;border-radius:var(--r);margin-bottom:10px}
    .sk-thumbs{display:flex;gap:8px}
    .sk-th{width:72px;height:72px;border-radius:8px;flex-shrink:0}
    .sk-ln{height:14px;margin-bottom:10px;border-radius:6px}

    /* ══ FULL-SCREEN LIGHTBOX ════════════════════════════════════════ */
    #lightbox{
      position:fixed;inset:0;z-index:9999;
      background:#000;
      display:flex;flex-direction:column;
      overscroll-behavior:none;
    }
    /* Top bar */
    .lb-top{
      display:flex;align-items:center;justify-content:space-between;
      padding:12px 16px;flex-shrink:0;
      background:linear-gradient(to bottom,rgba(0,0,0,.7),transparent);
      position:absolute;top:0;left:0;right:0;z-index:2;
    }
    .lb-ctr{color:rgba(255,255,255,.7);font-size:.85rem;font-weight:500}
    .lb-close{
      background:rgba(255,255,255,.15);color:#fff;border:none;
      border-radius:50%;width:42px;height:42px;font-size:1.5rem;
      cursor:pointer;display:flex;align-items:center;justify-content:center;
      transition:background .15s;
    }
    .lb-close:hover{background:rgba(255,255,255,.3)}
    /* Image area — takes all space */
    .lb-img-area{
      flex:1;display:flex;align-items:center;justify-content:center;
      overflow:hidden;position:relative;
    }
    #lb-img{
      max-width:100%;max-height:100%;object-fit:contain;
      display:block;user-select:none;-webkit-user-drag:none;
      transform-origin:center center;will-change:transform;
      transition:none;
    }
    /* Side nav arrows */
    .lb-arr{
      position:absolute;top:50%;transform:translateY(-50%);
      background:rgba(255,255,255,.15);color:#fff;border:none;
      border-radius:50%;width:48px;height:48px;font-size:1.6rem;
      cursor:pointer;display:flex;align-items:center;justify-content:center;
      transition:background .15s;z-index:3;
    }
    .lb-arr:hover{background:rgba(255,255,255,.3)}
    #lb-prev{left:12px}#lb-next{right:12px}
    /* Bottom hint */
    .lb-hint{
      position:absolute;bottom:0;left:0;right:0;
      background:linear-gradient(to top,rgba(0,0,0,.6),transparent);
      padding:20px 16px 14px;
      display:flex;align-items:center;justify-content:center;gap:14px;
      z-index:2;
    }
    .lb-btn{
      background:rgba(255,255,255,.15);color:#fff;border:none;
      border-radius:8px;width:40px;height:40px;font-size:1rem;
      cursor:pointer;display:flex;align-items:center;justify-content:center;
      transition:background .15s;font-weight:700;font-family:inherit;
    }
    .lb-btn:hover{background:rgba(255,255,255,.3)}
    #lb-pct{color:rgba(255,255,255,.6);font-size:.8rem;min-width:44px;text-align:center}
    #lb-tip{color:rgba(255,255,255,.4);font-size:.72rem;position:absolute;bottom:60px;left:50%;transform:translateX(-50%);white-space:nowrap;pointer-events:none;transition:opacity .5s}


    /* ── Cart ─────────────────────────────────────────────────────── */
    .cart-fab{position:fixed;bottom:24px;right:18px;z-index:150;background:var(--primary);color:#fff;border:none;border-radius:99px;padding:11px 20px;font:600 .88rem 'Inter',sans-serif;cursor:pointer;box-shadow:0 4px 18px rgba(0,0,0,.28);display:flex;align-items:center;gap:8px;transition:all .2s}
    .cart-fab:hover{transform:translateY(-2px)}
    .cart-ct{background:#DC2626;color:#fff;font-size:.65rem;font-weight:700;min-width:18px;height:18px;border-radius:99px;display:flex;align-items:center;justify-content:center;padding:0 4px;line-height:1}
    .cart-ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;opacity:0;pointer-events:none;transition:opacity .25s}
    .cart-ov.open{opacity:1;pointer-events:all}
    .cart-dr{position:fixed;top:0;right:0;bottom:0;width:min(400px,100vw);background:#fff;z-index:201;display:flex;flex-direction:column;transform:translateX(110%);transition:transform .28s cubic-bezier(.4,0,.2,1);box-shadow:-4px 0 24px rgba(0,0,0,.15)}
    .cart-dr.open{transform:translateX(0)}
    .c-hdr{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);flex-shrink:0}
    .c-hdr h2{font-size:1rem;font-weight:700}
    .c-x{background:none;border:none;font-size:1.3rem;cursor:pointer;color:var(--muted);padding:4px;border-radius:6px}
    .c-x:hover{background:var(--border)}
    .c-list{flex:1;overflow-y:auto;padding:4px 0}
    .c-item{display:flex;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid var(--border)}
    .c-body{flex:1;min-width:0}
    .c-name{font-size:.88rem;font-weight:600;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .c-pr{font-size:.9rem;font-weight:700;color:var(--primary)}
    .c-rm{background:none;border:none;color:var(--muted);font-size:1.1rem;cursor:pointer;padding:6px;border-radius:6px;transition:all .15s;flex-shrink:0}
    .c-rm:hover{background:#FEE2E2;color:#DC2626}
    .c-empty{text-align:center;padding:48px 20px;color:var(--muted)}
    .c-ftr{border-top:1px solid var(--border);padding:16px 20px;flex-shrink:0}
    .c-tot-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
    .c-tot-lbl{font-size:.9rem;font-weight:600}
    .c-tot-amt{font-size:1.3rem;font-weight:700;color:var(--primary)}
    .wa-btn{width:100%;background:#25D366;color:#fff;border:none;border-radius:10px;padding:13px;font:600 .95rem 'Inter',sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .15s}
    .wa-btn:hover{background:#1DA855}
    .add-cart-btn{background:var(--primary);color:#fff;border:none;border-radius:6px;padding:6px 14px;font:600 .82rem 'Inter',sans-serif;cursor:pointer;transition:background .15s;white-space:nowrap}
    .add-cart-btn:hover{background:#944F20}
    .hidden{display:none!important}
  </style>
</head>
<body>

<nav class="nav">
  <a href="index.html" class="back">&#8592; Gallery</a>
  <span class="nav-name" id="nav-name"></span>
</nav>

<!-- Skeleton -->
<div id="sk" class="sk-layout">
  <div>
    <div class="sk sk-img"></div>
    <div class="sk-thumbs">
      <div class="sk sk-th"></div><div class="sk sk-th"></div><div class="sk sk-th"></div>
    </div>
  </div>
  <div style="padding-top:8px">
    <div class="sk sk-ln" style="width:40%;margin-bottom:8px"></div>
    <div class="sk sk-ln" style="height:34px;width:80%;margin-bottom:22px"></div>
    <div class="sk sk-ln" style="height:28px;width:46%;margin-bottom:22px"></div>
    <div class="sk sk-ln" style="height:1px;margin-bottom:22px"></div>
    <div class="sk sk-ln" style="width:28%;margin-bottom:12px"></div>
    <div class="sk sk-ln" style="height:120px"></div>
  </div>
</div>

<!-- Error -->
<div id="err" class="msg hidden">
  <span class="ico">&#128230;</span>
  <h3>Product not found</h3>
  <p id="err-txt">This product may have been removed.</p>
</div>

<!-- Detail page -->
<div id="page" class="page hidden">

  <!-- Gallery -->
  <div class="gallery">
    <div class="main-wrap" id="main-wrap">
      <img id="main-img" alt="Product" />
      <div class="zoom-hint">&#128269; Tap to zoom</div>
      <button class="garr p hidden" id="garr-p" onclick="prevImg()">&#8249;</button>
      <button class="garr n hidden" id="garr-n" onclick="nextImg()">&#8250;</button>
    </div>
    <div class="thumbs" id="thumbs"></div>
  </div>

  <!-- Info -->
  <div>
    <span class="tag">Furniture for Sale &#127465;&#127466;</span>
    <h1 class="ptitle" id="p-title"></h1>
    <div class="prow">
      <span class="pprice" id="p-price"></span>
      <span class="badge" id="p-status"></span>
      <button class="add-cart-btn hidden" id="add-cart-btn" onclick="detailCartAdd()">+ Add to Cart</button>
    </div>
    <div class="divider"></div>
    <div class="dlabel">Description</div>
    <p class="desc" id="p-desc"></p>
  </div>

</div>

<!-- FULL-SCREEN LIGHTBOX -->
<div id="lightbox" class="hidden">
  <div class="lb-top">
    <span class="lb-ctr" id="lb-ctr"></span>
    <button class="lb-close" id="lb-close">&#215;</button>
  </div>
  <div class="lb-img-area" id="lb-area">
    <img id="lb-img" alt="Zoom" />
    <button class="lb-arr" id="lb-prev">&#8249;</button>
    <button class="lb-arr" id="lb-next">&#8250;</button>
    <span id="lb-tip">Double-tap &#183; Pinch to zoom &#183; Drag to pan</span>
  </div>
  <div class="lb-hint">
    <button class="lb-btn" id="lb-out">&#8722;</button>
    <span id="lb-pct">100%</span>
    <button class="lb-btn" id="lb-in">+</button>
    <button class="lb-btn" id="lb-rst">&#8635;</button>
  </div>
</div>

<script>
/* ── CONFIG ─────────────────────────────────────────────────────── */
const CONFIG = { owner: '', repo: '', branch: 'main' };

function repoInfo() {
  if (CONFIG.owner && CONFIG.repo) return CONFIG;
  const h = location.hostname, p = location.pathname;
  if (h.endsWith('.github.io'))
    return { owner: h.slice(0, h.indexOf('.github.io')), repo: p.split('/').filter(Boolean)[0]||'', branch: CONFIG.branch };
  return null;
}

/* ── State ───────────────────────────────────────────────────────── */
var imgs = [], cur = 0;

/* ── Helpers ─────────────────────────────────────────────────────── */
function g(id){ return document.getElementById(id); }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function show(id){ g(id).classList.remove('hidden'); }
function hide(id){ g(id).classList.add('hidden'); }

/* ── Load ────────────────────────────────────────────────────────── */
async function load() {
  var pid = new URLSearchParams(location.search).get('id');
  if (!pid) return showErr('No product ID in URL.');
  var r = repoInfo();
  if (!r || !r.owner || !r.repo) return showErr('Repo not configured. Deploy to GitHub Pages.');
  var url = 'https://raw.githubusercontent.com/' + r.owner + '/' + r.repo + '/' + r.branch + '/data/products.json?_=' + Date.now();
  try {
    var res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    var all = await res.json();
    var p = null;
    for (var i = 0; i < all.length; i++) { if (all[i].id === pid) { p = all[i]; break; } }
    if (!p) return showErr('Product not found.');
    render(p);
  } catch(e) {
    showErr(e.message);
  }
}

/* ── Render ──────────────────────────────────────────────────────── */
function render(p) {
  hide('sk');
  productData = p;
  imgs = p.images || [];
  cur  = 0;
  if(!p.sold){ show('add-cart-btn'); }else{ hide('add-cart-btn'); }

  document.title = p.title + ' — Furniture Sale';
  g('nav-name').textContent = p.title;
  g('p-title').textContent  = p.title;
  g('p-price').textContent  = '\u20AC' + Number(p.price).toLocaleString('de-DE');
  g('p-desc').textContent   = p.description || '';

  var st = g('p-status');
  if (p.sold) { st.textContent = 'Sold';      st.className = 'badge sd'; }
  else         { st.textContent = 'Available'; st.className = 'badge av'; }

  if (imgs.length) {
    g('main-img').src = imgs[0];
    g('main-wrap').onclick = function() { openLb(cur); };
    g('main-wrap').style.cursor = 'zoom-in';
  } else {
    g('main-img').style.display = 'none';
    g('main-wrap').style.cursor = 'default';
    g('main-wrap').insertAdjacentHTML('afterbegin', '<div class="ph">&#128715;</div>');
  }

  if (imgs.length > 1) {
    show('garr-p'); show('garr-n');
    var html = '';
    for (var i = 0; i < imgs.length; i++) {
      html += '<div class="thumb ' + (i===0?'on':'') + '" id="th'+i+'" onclick="selImg('+i+')"><img src="'+esc(imgs[i])+'" loading="lazy" /></div>';
    }
    g('thumbs').innerHTML = html;
  }

  show('page');
}

/* ── Gallery navigation ──────────────────────────────────────────── */
function selImg(i) {
  var old = g('th'+cur); if (old) old.classList.remove('on');
  cur = i;
  var nw = g('th'+cur); if (nw) nw.classList.add('on');
  g('main-img').src = imgs[i];
}
function prevImg() { selImg((cur - 1 + imgs.length) % imgs.length); }
function nextImg() { selImg((cur + 1) % imgs.length); }

/* ══════════════════════════════════════════════════════════════════
   FULL-SCREEN LIGHTBOX
   ══════════════════════════════════════════════════════════════════ */
var lbIdx = 0, lbSc = 1, lbX = 0, lbY = 0;
var drag = false, dsx = 0, dsy = 0, psx = 0, psy = 0;
var pd0 = 0, ps0 = 1, lastTap = 0;

function openLb(idx) {
  if (!imgs.length) return;
  lbIdx = idx; lbSc = 1; lbX = 0; lbY = 0;
  show('lightbox');
  document.body.style.overflow = 'hidden';
  lbSync();
  var tip = g('lb-tip');
  if (tip) setTimeout(function(){ tip.style.opacity='0'; }, 3000);
}

function closeLb() {
  hide('lightbox');
  document.body.style.overflow = '';
  lbSc = 1; lbX = 0; lbY = 0;
  applyT(false);
}

function lbSync() {
  g('lb-img').src = imgs[lbIdx];
  g('lb-ctr').textContent = (lbIdx+1) + ' / ' + imgs.length;
  var m = imgs.length > 1;
  g('lb-prev').style.display = m ? '' : 'none';
  g('lb-next').style.display = m ? '' : 'none';
  lbSc = 1; lbX = 0; lbY = 0;
  applyT(false);
}

function lbNav(d) { lbIdx = (lbIdx + d + imgs.length) % imgs.length; lbSync(); }
function lbZoom(d) {
  lbSc = Math.max(1, Math.min(6, lbSc * (1 + d)));
  if (lbSc === 1) { lbX = 0; lbY = 0; }
  applyT(true);
}
function lbReset() { lbSc = 1; lbX = 0; lbY = 0; applyT(true); }

function applyT(smooth) {
  var img = g('lb-img');
  img.style.transition = smooth ? 'transform .2s cubic-bezier(.4,0,.2,1)' : 'none';
  img.style.transform  = 'translate('+lbX+'px,'+lbY+'px) scale('+lbSc+')';
  g('lb-pct').textContent = Math.round(lbSc*100) + '%';
  var area = g('lb-area');
  if (area) area.style.cursor = lbSc > 1 ? 'grab' : 'zoom-in';
}

/* ── Wire up lightbox buttons ────────────────────────────────────── */
window.addEventListener('DOMContentLoaded', function() {
  g('lb-close').addEventListener('click', closeLb);
  g('lb-prev').addEventListener('click', function(){ lbNav(-1); });
  g('lb-next').addEventListener('click', function(){ lbNav(1); });
  g('lb-in').addEventListener('click',  function(){ lbZoom(.35); });
  g('lb-out').addEventListener('click', function(){ lbZoom(-.3); });
  g('lb-rst').addEventListener('click', lbReset);
  g('lb-close').addEventListener('click', closeLb);
  g('lb-prev').addEventListener('click', function(){ lbNav(-1); });
  g('lb-next').addEventListener('click', function(){ lbNav(1); });
  g('lb-in').addEventListener('click',  function(){ lbZoom(.35); });
  g('lb-out').addEventListener('click', function(){ lbZoom(-.3); });
  g('lb-rst').addEventListener('click', lbReset);
  cBadge();

  var area = g('lb-area');

  /* Mouse drag */
  area.addEventListener('mousedown', function(e) {
    if (lbSc > 1) { drag=true; dsx=e.clientX; dsy=e.clientY; psx=lbX; psy=lbY; area.style.cursor='grabbing'; e.preventDefault(); }
  });
  document.addEventListener('mousemove', function(e) {
    if (!drag) return;
    lbX = psx + (e.clientX-dsx)/lbSc;
    lbY = psy + (e.clientY-dsy)/lbSc;
    applyT(false);
  });
  document.addEventListener('mouseup', function() {
    drag=false;
    if (!g('lightbox').classList.contains('hidden')) applyT(false);
  });

  /* Scroll wheel */
  area.addEventListener('wheel', function(e) {
    e.preventDefault();
    lbSc = Math.max(1, Math.min(6, lbSc * (e.deltaY < 0 ? 1.18 : 0.85)));
    if (lbSc===1) { lbX=0; lbY=0; }
    applyT(false);
  }, { passive: false });

  /* Double-click */
  area.addEventListener('dblclick', function() {
    if (lbSc > 1) lbReset(); else { lbSc=2.5; applyT(true); }
  });

  /* Touch */
  area.addEventListener('touchstart', function(e) {
    if (e.touches.length === 2) {
      pd0 = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
      ps0 = lbSc;
    } else {
      var now = Date.now();
      if (now - lastTap < 280) { e.preventDefault(); if(lbSc>1) lbReset(); else { lbSc=2.5; applyT(true); } }
      lastTap = now;
      if (lbSc > 1) { dsx=e.touches[0].clientX; dsy=e.touches[0].clientY; psx=lbX; psy=lbY; }
    }
  }, { passive: false });

  area.addEventListener('touchmove', function(e) {
    e.preventDefault();
    if (e.touches.length === 2) {
      var d = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
      lbSc = Math.max(1, Math.min(6, ps0 * (d/pd0)));
      if (lbSc===1) { lbX=0; lbY=0; }
      applyT(false);
    } else if (e.touches.length===1 && lbSc>1) {
      lbX = psx + (e.touches[0].clientX-dsx)/lbSc;
      lbY = psy + (e.touches[0].clientY-dsy)/lbSc;
      applyT(false);
    }
  }, { passive: false });

  /* Keyboard */
  document.addEventListener('keydown', function(e) {
    if (g('lightbox').classList.contains('hidden')) return;
    if (e.key==='Escape')                    closeLb();
    if (e.key==='ArrowLeft')                 lbNav(-1);
    if (e.key==='ArrowRight')                lbNav(1);
    if (e.key==='+'||e.key==='=')            lbZoom(.35);
    if (e.key==='-')                         lbZoom(-.3);
    if (e.key==='0')                         lbReset();
  });
});

/* ── Error / utils ───────────────────────────────────────────────── */
function showErr(msg) {
  hide('sk');
  show('err');
  g('err-txt').textContent = msg;
}


/* ── Cart Logic ─────────────────────────────────────────────────── */
var productData = null;

function getCart(){try{return JSON.parse(localStorage.getItem('fg_cart')||'[]');}catch(e){return[];}}
function saveCart(c){localStorage.setItem('fg_cart',JSON.stringify(c));}

function detailCartAdd(){
  if(!productData)return;
  var cart=getCart();
  for(var i=0;i<cart.length;i++){if(cart[i].id===productData.id){cToast('Already in cart \u2714');return;}}
  cart.push({id:productData.id,title:productData.title,price:productData.price});
  saveCart(cart);cBadge();cToast('Added to cart \u2705');
}

function cartRemove(id){
  saveCart(getCart().filter(function(x){return x.id!==id;}));
  cBadge();renderCart();
}

function cBadge(){
  var n=getCart().length,b=g('cart-ct');
  if(b){b.textContent=n;b.style.display=n>0?'flex':'none';}
}

function openCart(){
  g('cart-ov').classList.add('open');
  g('cart-dr').classList.add('open');
  document.body.style.overflow='hidden';
  renderCart();
}

function closeCart(){
  g('cart-ov').classList.remove('open');
  g('cart-dr').classList.remove('open');
  document.body.style.overflow='';
}

function renderCart(){
  var cart=getCart(),list=g('c-list'),wa=g('wa-btn'),tot=g('c-tot');
  if(!cart.length){
    list.innerHTML='<div class="c-empty"><p>\u{1F6D2} Cart is empty</p></div>';
    if(wa)wa.style.display='none';if(tot)tot.textContent='\u20AC0';return;
  }
  var total=0,html='';
  for(var i=0;i<cart.length;i++){
    var item=cart[i];total+=Number(item.price);
    html+='<div class="c-item"><div class="c-body"><div class="c-name">'+xss(item.title)+'</div>'+
      '<div class="c-pr">\u20AC'+Number(item.price).toLocaleString('de-DE')+'</div></div>'+
      '<button class="c-rm" onclick="cartRemove(\''+item.id+'\')">\u00D7</button></div>';
  }
  list.innerHTML=html;
  if(tot)tot.textContent='\u20AC'+total.toLocaleString('de-DE');
  if(wa)wa.style.display='';
}

function contactWa(){
  var cart=getCart();if(!cart.length)return;
  var msg='Halo! Saya tertarik membeli:\n\n',total=0;
  for(var i=0;i<cart.length;i++){
    msg+='\u2022 '+cart[i].title+': \u20AC'+Number(cart[i].price).toLocaleString('de-DE')+'\n';
    total+=Number(cart[i].price);
  }
  msg+='\nTotal: \u20AC'+total.toLocaleString('de-DE');
  msg+='\n\nDari: adibrusydif.github.io/my-furniture-sale';
  window.open('https://wa.me/6287733933830?text='+encodeURIComponent(msg),'_blank');
}

function xss(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

var _ct;
function cToast(msg){
  var t=document.getElementById('_ct');
  if(!t){t=document.createElement('div');t.id='_ct';
    t.style.cssText='position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 22px;border-radius:99px;font:500 .875rem Inter,sans-serif;z-index:10000;white-space:nowrap;max-width:90vw;text-align:center;transition:opacity .2s;pointer-events:none';
    document.body.appendChild(t);}
  t.textContent=msg;t.style.opacity='1';
  clearTimeout(_ct);_ct=setTimeout(function(){t.style.opacity='0';},2500);
}

// In DOMContentLoaded we also register handlers for cart buttons if needed
/* ── Init ────────────────────────────────────────────────────────── */
load();
</script>

<!-- Cart drawer -->
<div class="cart-ov" id="cart-ov" onclick="closeCart()"></div>
<div class="cart-dr" id="cart-dr">
  <div class="c-hdr"><h2>&#128722; Your Cart</h2><button class="c-x" onclick="closeCart()">&#215;</button></div>
  <div class="c-list" id="c-list"></div>
  <div class="c-ftr">
    <div class="c-tot-row"><span class="c-tot-lbl">Total</span><span class="c-tot-amt" id="c-tot">&#8364;0</span></div>
    <button class="wa-btn" id="wa-btn" onclick="contactWa()" style="display:none">&#128241; Contact via WhatsApp</button>
  </div>
</div>
